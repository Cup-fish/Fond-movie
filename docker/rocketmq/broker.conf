brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
listenPort = 10911
storePathRootDir = /home/rocketmq/data/store
storePathCommitLog = /home/rocketmq/data/store/commitlog
storePathConsumerQueue = /home/rocketmq/data/store/consumequeue
storePathIndex = /home/rocketmq/data/store/index
storePathCheckpoint = /home/rocketmq/data/store/checkpoint
storePathAbort = /home/rocketmq/data/store/abort
maxMessageSize = 4194304
# 延迟消息等级
messageDelayLevel = 1s 5s 10s 30s 1m 2m 5m 10m 30m 1h 2h 6h 12h 24h
brokerIP1 = 0.0.0.0
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# ====== 低内存优化（2G服务器）======
# CommitLog 单文件 100MB（默认 1GB，太大会 OOM）
mapedFileSizeCommitLog = 104857600
# ConsumeQueue 单文件 2MB（默认 6MB）
mapedFileSizeConsumeQueue = 2097152
# 减少线程池大小
sendMessageThreadPoolNums = 2
pullMessageThreadPoolNums = 2
# 关闭堆外缓存池（节省直接内存）
transientStorePoolEnable = false
# 关闭 slaveActingMaster
enableSlaveActingMaster = false
